# deploy/security-headers.conf
#
# nginx snippet for the BUILT frontend (the dist/ folder from `npm run build`).
# Save as /etc/nginx/snippets/security-headers.conf and include it as shown below.
#
# Replace API_ORIGIN with your FastAPI origin, e.g. https://api.example.com
# (scheme + host, no trailing slash, no path).
#
# Roll out with the header name Content-Security-Policy-Report-Only first, watch the
# browser console for violations for a day, then switch to Content-Security-Policy.

add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' API_ORIGIN; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;

# HSTS: only meaningful once the site is served over HTTPS. Add "preload" only if every
# subdomain is HTTPS-only and you intend to submit the domain to the preload list.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ---------------------------------------------------------------------------
# Example server block (note: nginx drops inherited add_header lines inside any
# location that sets its own add_header, so the snippet is included again there):
#
# server {
#     listen 443 ssl http2;
#     server_name example.com;
#     root /var/www/draingrid/dist;
#     index index.html;
#
#     include snippets/security-headers.conf;
#
#     # SPA fallback: /worker, /ledger and the custom 404 page work on refresh.
#     location / {
#         try_files $uri /index.html;
#     }
#
#     # Hashed build assets can be cached for a year.
#     location /assets/ {
#         include snippets/security-headers.conf;
#         add_header Cache-Control "public, max-age=31536000, immutable" always;
#         try_files $uri =404;
#     }
# }
#
# Netlify / Cloudflare Pages / Vercel: the same header names and values map directly onto
# a public/_headers file or the platform's headers setting.
#
# Notes
# - The CSP applies to the production build. `vite dev` injects inline scripts and styles
#   for hot reload, so test the CSP with `npm run build && npm run preview`.
# - img-src allows data: (photos are uploaded as data URLs) and https: (the "image link"
#   option). When uploads move to server-side storage, replace both with your image
#   host, e.g. img-src 'self' https://cdn.example.com
# - Styles set from React's `style` prop go through the CSSOM, which style-src 'self'
#   permits, so no 'unsafe-inline' is needed.
