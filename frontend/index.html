<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>DrainGRID AI · Report and verify blocked drains</title>
    <meta
      name="description"
      content="Report a blocked drain in seconds. DrainGRID locks your location, field workers clear the drain, and AI verifies the repair in a public audit ledger."
    />
    <meta name="theme-color" content="#041029" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DrainGRID AI" />
    <meta property="og:title" content="DrainGRID AI · Report and verify blocked drains" />
    <meta
      property="og:description"
      content="Citizen-powered drainage reporting, verified by AI and published in an open ledger."
    />
      <script>
      (function () {
        try {
          var t = localStorage.getItem('draingrid-theme');
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var r = document.documentElement;
          r.classList.remove('dark', 'light');
          r.classList.add(t);
          r.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#041029' : '#f1f5f9');
        } catch (e) {}
      })();
    </script>
      <!-- Adaptive Chrome Tab Favicons: dark logo on light browser tab, light logo on dark browser tab -->


      <!-- Adaptive Chrome Tab Favicons: dark logo on light browser tab, light logo on dark browser tab -->
    <link rel="icon" type="image/svg+xml" href="/favicon-dark.svg?v=dual1" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg?v=dual1" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon-light.svg?v=dual1" />
  </head>
  <body>
    <noscript>DrainGRID AI needs JavaScript to run. Please enable it in your browser and reload.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
